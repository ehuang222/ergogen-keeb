meta:
  engine: 4.2.1
units:
  mx: U # 19.05mm for MX switch footprint, 18.00mm for keycaps, 14.00mm for plate holes
  $default_width: U - 1
  $default_height: U - 1
  pd: 2
  px: mx + pd
  py: mx + pd
  case_pd: 7
points:
  key:
    tags:
    - key
    padding: 1mx
    spread: 1mx
  zones:
    matrix:
      anchor:
        shift: [150, -170] # Fix KiCad placement
      columns:
        c0.key.column_net: P2
        c1.key.column_net: P3
        c2:
          key:
            stagger: mx/2
            column_net: P4
        c3:
          key:
            stagger: mx/4
            column_net: P5
        c4:
          key:
            stagger: -mx/8
            column_net: P21
          rows.mods.skip: true
        c5:
          key:
            stagger: -mx/8
            column_net: P20
          rows.mods.skip: true
        c6:
          key:
            stagger: -mx/2
            column_net: P19
          rows.r3.skip: true
          rows.mods.skip: true
      rows:
        mods.row_net: P14
        r3.row_net: P7
        r2.row_net: P15
        r1.row_net: P6
        r0.row_net: P18
    thumbfan:
      anchor:
        - ref: matrix_c4_r3
          shift: [mx/2, -mx - 4.75]
      columns:
        t0.key:
            splay: -22
            shift: [0, 0]
            width: 1.5mx
            tags: [key, key_1_5uw]
            column_net: P20
        t1.key:
          splay: 0
          shift: [0, mx/4]
          spread: 1.255mx
          height: 1.5mx
          tags: [key, key_1_5u]
          column_net: P19
      rows:
        r0.row_net: P14
  mirror: &mirror
    ref: matrix_c6_r0
    distance: 3mx
outlines:
  _thumbfan_enclosed_left:
    - what: polygon
      operation: stack
      fillet: 0
      points:
        - ref: matrix_c3_mods
          shift: [mx/2 - 0.5, -mx/2 - 0.5]
        - ref: matrix_c3_mods
          shift: [mx/2, mx/2]
        - ref: matrix_c3_mods
          shift: [2.5mx + 0.5, mx/2]
        - ref: matrix_c5_r3
          shift: [mx/2 + 0.5, -mx/2 + 1.25]
        - ref: thumbfan_t1_r0
          shift: [mx/2 + 0.5, 1.5mx/2 + 0.5] # top-right t1
        - ref: thumbfan_t1_r0
          shift: [mx/2 + 0.5, -1.5mx/2 - 0.5] # bottom-right t1
  _thumbfan_enclosed_right:
    - what: polygon
      operation: stack
      fillet: 0
      points:
        - ref: mirror_matrix_c3_mods
          shift: [mx/2 - 0.5, -mx/2 - 0.5]
        - ref: mirror_matrix_c3_mods
          shift: [mx/2, mx/2]
        - ref: mirror_matrix_c3_mods
          shift: [2.5mx + 0.5, mx/2]
        - ref: mirror_matrix_c5_r3
          shift: [mx/2 + 0.5, -mx/2 + 1.25]
        - ref: mirror_thumbfan_t1_r0
          shift: [mx/2 + 0.5, 1.5mx/2 + 0.5] # top-left t1
        - ref: mirror_thumbfan_t1_r0
          shift: [mx/2 + 0.5, -1.5mx/2 - 0.5] # bottom-left t1
  keys_enclosed:
    - what: rectangle
      where: /(?:^matrix_|^mirror_matrix_).*/
      size: mx + 1
      fillet: 0
    - what: outline
      name: _thumbfan_enclosed_left
      operation: add
    - what: outline
      name: _thumbfan_enclosed_right
      operation: add
  key_cutouts:
    - what: rectangle
      where: true
      size: [14, 14] # plate hole cutouts are 14.00mm x 14.00mm
  keycaps: # Keycaps are 18.00mm x 18.00mm
    - what: rectangle
      where: true
      size: mx - 1
      fillet: 1
    - what: rectangle
      where: [key_1_5uw]
      size: [1.5mx-1, mx-1]
      fillet: 1
    - what: rectangle
      where: [key_1_5u]
      size: [mx-1, 1.5mx-1]
      fillet: 1
  board_left:
    - what: polygon
      operation: stack
      fillet: 2
      points:
        - ref: matrix_c0_r0 # top-left board
          shift: [-px/2, py/2]
        - ref: matrix_c3_r0
          shift: [-3px/2, py/2]
        - ref: matrix_c3_r0
          shift: [1.85px - pd, py/2]
        - ref: matrix_c6_r0
          shift: [px/2, py/2] # top-right board
        - ref: matrix_c6_r2
          shift: [px/2, -1.25py + 0.25] # top-right t1
        - ref: thumbfan_t1_r0
          shift: [px/2, -py/1.25 + 1.5] # bottom-right t1
        - ref: thumbfan_t0_r0
          shift: [-1.5px/2, -py/2] # bottom-left t0
        - ref: matrix_c1_mods
          shift: [px/2 - pd, -py/2]
        - ref: matrix_c0_mods
          shift: [-px/2, -py/2]
        - ref: matrix_c0_r3
          shift: [-px/2, -py/2]
  board_right:
    - what: polygon
      operation: stack
      fillet: 2
      points:
        - ref: mirror_matrix_c0_r0 # top-right board
          shift: [-px/2, py/2]
        - ref: mirror_matrix_c3_r0
          shift: [-3px/2, py/2]
        - ref: mirror_matrix_c3_r0
          shift: [1.85px - pd, py/2]
        - ref: mirror_matrix_c6_r0
          shift: [px/2, py/2] # top-left board
        - ref: mirror_matrix_c6_r2
          shift: [px/2, -1.25py + 0.25] # top-left t1
        - ref: mirror_thumbfan_t1_r0
          shift: [px/2, -py/1.25 + 1.5] # bottom-left t1
        - ref: mirror_thumbfan_t0_r0
          shift: [-1.5px/2, -py/2] # bottom-left t0
        - ref: mirror_matrix_c1_mods
          shift: [px/2 - pd, -py/2]
        - ref: mirror_matrix_c0_mods
          shift: [-px/2, -py/2]
        - ref: mirror_matrix_c0_r3
          shift: [-px/2, -py/2]
  board_full:
    - what: outline
      name: board_left
      operation: stack
    - what: outline
      name: board_right
      operation: stack
  preview:
    - what: outline
      name: board_left
      operation: stack
    - what: outline
      name: board_right
      operation: stack
    - what: outline
      name: keycaps
      operation: stack
  plate:
    - what: outline
      name: board_left
      operation: stack
    - what: outline
      name: board_right
      operation: stack
    - what: outline
      name: key_cutouts
      operation: stack
  preview_w_case:
    - what: outline
      name: board_left
      operation: stack
    - what: outline
      name: board_right
      operation: stack
      expand: 6
    - what: outline
      name: keys_enclosed
      operation: subtract
      fillet: 1
    - what: outline
      name: keycaps
      operation: stack
pcbs:
  keeb_left:
    template: kicad8 # Required, since footprints are KiCad 8 only
    outlines:
      main_board:
        outline: board_left
    footprints:
      mcu:
        what: ceoloide/mcu_nice_nano
        where:
          ref: matrix_c3_r0
          rotate: 0
          shift: [1, -6]
        params:
          side: B
          reverse_mount: true
      mx_hotswap:
        what: ceoloide/switch_mx
        where: /(?:^matrix_)(?!(?:c3_r[0-1])).*/
        params:
          include_keycap: true
          reversible: false
          hotswap: true
          from: "{{column_net}}"
          to: "{{colrow}}"
      mx_hotswap_right:
        what: ceoloide/switch_mx
        where: /(?:^matrix_|^thumbfan_)(?:c3_r[0-1]).*/
        adjust:
          rotate: -90
        params:
          include_keycap: true
          reversible: false
          hotswap: true
          from: "{{column_net}}"
          to: "{{colrow}}"
      mx_t0:
        what: ceoloide/switch_mx
        where: thumbfan_t0_r0
        params:
          include_keycap: true
          keycap_width: 27.575 # 19.05mm * 1.5 - 1
          reversible: false
          hotswap: true
          from: "{{column_net}}"
          to: "{{colrow}}"
      mx_t1:
        what: ceoloide/switch_mx
        where: thumbfan_t1_r0
        adjust:
          rotate: 90
        params:
          include_keycap: true
          keycap_width: 27.575 # 19.05mm * 1.5 - 1
          reversible: false
          hotswap: true
          from: "{{column_net}}"
          to: "{{colrow}}"
      diode:
        what: ceoloide/diode_tht_sod123
        where: /(?:^matrix_|^thumbfan_)(?!(?:c3_r[0-1]|t1)).*/
        params:
          from: "{{colrow}}"
          to: "{{row_net}}"
        adjust:
          shift: [mx/2 - 1, -4]
          rotate: 90
      diode_mcu:
        what: ceoloide/diode_tht_sod123
        where: /(?:^matrix_|^thumbfan_)(?:c3_r[0-1]).*/
        params:
          from: "{{colrow}}"
          to: "{{row_net}}"
        adjust:
          shift: [0, -8]
          rotate: 0
      diode_t1:
        what: ceoloide/diode_tht_sod123
        where: /(?:^matrix_|^thumbfan_)(?:t1).*/
        params:
          from: "{{colrow}}"
          to: "{{row_net}}"
        adjust:
          shift: [4, mx/2 - 1]
          rotate: 180
      battery_jst:
        what: ceoloide/battery_connector_jst_ph_2
        where:
          ref: matrix_c1_r0
        adjust:
          shift: [-7, mx/2 + 4]
          rotate: 90
        params:
          side: B
      reset_switch:
        what: ceoloide/reset_switch_smd_side
        where: matrix_c2_r0
        params:
          side: B
          from: GND
          to: RST
          reversible: false
        adjust:
          shift: [mx/2 - 5, mx/2 + 4]
          rotate: 0
      battery_switch:
        what: ceoloide/power_switch_smd_side
        where: matrix_c4_r0
        params:
          side: B
          from: BAT_P
          to: RAW
          reversible: false
        adjust:
          shift: [0, mx/2 + 1.6]
          rotate: 90
cases:
  key_plate:
    - what: outline
      name: plate
      extrude: 1.5  

